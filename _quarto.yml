project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "roadmap/**/*.qmd"
  pre-render:
    - python3 scripts/render_profile.py
  post-render:
    - python3 scripts/version_stylesheet.py
  resources:
    - CNAME
    - assets/site.js
    - assets/figure-viewer.js
    - notebooks/*.ipynb

website:
  title: "Yan Xu"
  site-url: "https://yanxu.io"
  description: "Foundation models, post-training, reinforcement learning, and multimodal systems—from first principles to working code."
  favicon: assets/favicon-yx.svg
  open-graph: true
  twitter-card: true
  search: false
  navbar:
    title: "Home"
    pinned: true
    background: "#faf9f6"
    foreground: "#20211e"
    right:
      - href: index.qmd#selected-work
        text: Work
      - href: essays.qmd
        text: Blog
      - href: cv.qmd
        text: CV
  page-footer:
    left: "© Yan Xu"
    center: '<span class="visitor-welcome" data-visitor-welcome aria-live="polite">Welcome, and thanks for stopping by.</span>'
    right: "[GitHub ↗](https://github.com/yanxulab) · [Back to top ↑](#)"

format:
  html:
    theme: default
    css: styles.css
    include-after-body: _includes/scripts.html
    lang: en
    toc: false
    code-copy: true
    code-overflow: wrap
    code-line-numbers: true
    anchor-sections: true
    smooth-scroll: true

execute:
  freeze: auto
